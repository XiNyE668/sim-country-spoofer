name: XiNyE WebRTC Guard V3 Public Download
on:
  push:
    branches: [build/xinye-webrtc-guard-v3-chrome]
    paths: ['.github/workflows/xinye-webrtc-guard-v3-publish.yml']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/xinye-webrtc-guard-v3-chrome
      - uses: actions/download-artifact@v4
        with:
          name: XiNyE-WebRTC-Guard-V3-Chrome-APK
          run-id: 40338186720
          github-token: ${{ github.token }}
          path: android-v3
      - name: Publish verified APK to isolated branch
        run: |
          set -euo pipefail
          test -s android-v3/app-debug.apk
          mkdir -p deliverables
          cp android-v3/app-debug.apk deliverables/XiNyE-WebRTC-Guard-V3.apk
          sha256sum deliverables/XiNyE-WebRTC-Guard-V3.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f deliverables/XiNyE-WebRTC-Guard-V3.apk
          git commit -m 'release: publish verified WebRTC Guard V3 APK [skip ci]'
          git push origin HEAD:build/xinye-webrtc-guard-v3-chrome
