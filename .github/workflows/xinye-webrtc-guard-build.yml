name: XiNyE WebRTC Guard APK
on:
  push:
    branches: [build/xinye-webrtc-guard-v1]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' || test -f "$ANDROID_HOME/platforms/android-35/android.jar"
      - name: Compile, package, sign
        run: gradle -p webrtc-guard-lsp --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK exists
        run: |
          test -s webrtc-guard-lsp/app/build/outputs/apk/debug/app-debug.apk
          sha256sum webrtc-guard-lsp/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs webrtc-guard-lsp/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: XiNyE-WebRTC-Guard-V1-APK
          if-no-files-found: error
          path: webrtc-guard-lsp/app/build/outputs/apk/debug/app-debug.apk
