name: XiNyE WebRTC Guard V2 Public Download
on:
  push:
    branches: [build/xinye-webrtc-guard-v2]
    paths: ['.github/workflows/xinye-webrtc-guard-v2-publish.yml']
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/xinye-webrtc-guard-v2
      - uses: actions/download-artifact@v4
        with:
          name: XiNyE-WebRTC-Guard-V2-APK
          run-id: 40328486213
          github-token: ${{ github.token }}
          path: android-v2
      - name: Publish verified APK to branch
        run: |
          set -euo pipefail
          test -s android-v2/app-debug.apk
          mkdir -p deliverables
          cp android-v2/app-debug.apk deliverables/XiNyE-WebRTC-Guard-V2.apk
          sha256sum deliverables/XiNyE-WebRTC-Guard-V2.apk
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f deliverables/XiNyE-WebRTC-Guard-V2.apk
          git commit -m 'release: publish verified WebRTC Guard V2 APK [skip ci]'
          git push origin HEAD:build/xinye-webrtc-guard-v2
