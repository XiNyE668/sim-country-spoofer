# Target carrier identity.
# Managed by the WebUI country/carrier preset selector.
TARGET_MCC=310
TARGET_MNC=260
TARGET_ISO=us
TARGET_ALPHA='T-Mobile'

# Number of SIM slots to publish in comma-separated Android Telephony properties.
SLOT_COUNT=2

# Polling interval used only when resetprop property-wait is unavailable.
WATCH_INTERVAL=15

# Delay after the first post-boot Telephony snapshot before enforcing the configured identity.
TELEPHONY_SETTLE_SECONDS=8

# Optional compatibility mode for non-standard gsm.*.0 / gsm.*.1 keys.
LEGACY_SLOT_PROPS=0
