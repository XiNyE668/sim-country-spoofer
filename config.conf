# Target carrier identity.
# Default is US / T-Mobile: MCC 310, MNC 260, ISO us.
TARGET_MCC=310
TARGET_MNC=260
TARGET_ISO=us
TARGET_ALPHA=T-Mobile

# Android 16 TelephonyProperties use comma-separated values for each phone slot.
SLOT_COUNT=2

# APatch uses resetprop event watching. This interval is only the fallback for other environments.
WATCH_INTERVAL=15

# Give Telephony a short post-boot settle window before enforcing the configured identity.
TELEPHONY_SETTLE_SECONDS=8

# Keep disabled on LineageOS 23.2. The canonical properties above are the Android 16 path.
LEGACY_SLOT_PROPS=0
