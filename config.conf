# Target carrier identity.
# Default is US / T-Mobile: MCC 310, MNC 260, ISO us.
TARGET_MCC=310
TARGET_MNC=260
TARGET_ISO=us
# If the carrier name contains spaces, wrap it in quotes.
TARGET_ALPHA=T-Mobile

# Number of SIM slots to publish in comma-separated telephony properties.
# OnePlus 12 is usually dual-SIM capable, so 2 is a good default.
SLOT_COUNT=2

# How long service.sh should keep reapplying values after boot.
# Telephony services may overwrite these properties while Android is starting.
REAPPLY_SECONDS=120
REAPPLY_INTERVAL=5
